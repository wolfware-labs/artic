name: Keep the golden diffs
description: Uploads the `<name>.actual.png` and `<name>.diff.png` that a failed golden comparison leaves beside its golden, as the artifact goldens-<runner OS>. Call it after the tests, when one failed.

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: goldens-${{ runner.os }}
        path: |
          crates/*/tests/goldens/*.actual.png
          crates/*/tests/goldens/*.diff.png
        if-no-files-found: ignore
