name: Mutate
description: Runs cargo-mutants over the workspace on lavapipe and Xvfb with .cargo/mutants.toml, then passes or fails the run as verdict.sh decides.

inputs:
  shard:
    description: The shard to run, such as `3/32`, zero-based.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-lavapipe
    - uses: ./.github/actions/setup-display
    # --in-place builds in the checkout, so the restored dependency cache is reused instead of
    # copying the tree for every mutant. The report goes to the summary, a missed mutant first.
    - name: Mutate
      shell: bash
      env:
        SHARD: ${{ inputs.shard }}
        ARTIC_REQUIRE_GPU: "1"
        ARTIC_REQUIRE_DISPLAY: "1"
      run: |
        status=0
        cargo mutants --workspace --in-place --no-shuffle --shard "$SHARD" --output "$RUNNER_TEMP" || status=$?
        bash "$GITHUB_ACTION_PATH/verdict.sh" "$RUNNER_TEMP" "$status" | tee -a "$GITHUB_STEP_SUMMARY"
