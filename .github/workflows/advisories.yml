name: Advisories

# Advisories are published without any change here, and CI's Deny job runs only on main and on pull
# requests that change dependencies, so a quiet week would go unchecked. This checks the lockfile
# against the advisory database every week; a failure is reported like any failed run.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: Check
        run: cargo deny --locked check advisories
