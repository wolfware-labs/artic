name: CodSpeed

# Runs the criterion benches (artic-core, artic-layout, artic-controls) under CodSpeed's CPU
# simulation, so each pull request reports how it changes them against main.
#
# The CodSpeed action authenticates with the benchmark job's OIDC token, so there's no CodSpeed
# token to store. Only that job gets the token, and every action it runs, `setup-rust`'s included,
# is pinned by commit, as Codecov's are.
#
# A change outside the paths below can't move a bench, so it doesn't run them: CodSpeed compares
# a pull request against the latest commit of main that has a run.

on:
  pull_request:
    paths: &benches
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/codspeed.yml'
      - '.github/actions/setup-rust/**'
  push:
    branches: [main]
    paths: *benches
  # Lets CodSpeed run the benches on past commits to build its first history.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-codspeed@6.0.0
      - name: Build the benches
        run: cargo codspeed build -m simulation
      - name: Run the benches
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run
