name: CI

# If the change filter itself fails, every job runs: a broken filter must cost minutes, never skip
# a check, since a skipped job satisfies a required one.
#
# The "Protect main" ruleset requires every job below by name. A skipped job still satisfies its
# required check, but only under its exact name, which is why the test jobs aren't a matrix: a
# skipped matrix job reports the unexpanded `Test (${{ matrix.os }})`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller target directories: faster to link and to cache.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    # The filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            dependencies:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  test-ubuntu:
    name: Test (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Test the facade's features
        run: cargo test -p artic --all-features
      - name: Test the registry without literals
        run: cargo test -p artic-registry

  coverage:
    name: Coverage
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    # Codecov takes the job's OIDC token, so there's no upload token to store. A pull request from a
    # fork can't get one; its upload fails, and so does nothing else.
    permissions:
      contents: read
      id-token: write
    # Every action this job runs is pinned by commit, since the job can mint an OIDC token: so it
    # sets Rust up itself rather than through `setup-rust`, whose cache action is a tag.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml, with llvm-tools
        run: rustup toolchain install && rustup component add llvm-tools && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      # The test jobs are the gate: a test that fails here, such as trybuild's comparison of
      # compiler output under instrumentation, still leaves a report. The GPU goldens skip on a
      # runner without a GPU, so the renderer's draw paths read as uncovered.
      - name: Measure
        run: cargo llvm-cov --workspace --ignore-run-fail --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false

  test-windows:
    name: Test (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Smoke
        run: cargo run -p artic-winit --example smoke
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
      - name: Idle
        run: cargo run -p artic-winit --example frames
        timeout-minutes: 5

  test-macos:
    name: Test (macos-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Smoke
        run: cargo run -p artic-winit --example smoke
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
      - name: Idle
        run: cargo run -p artic-winit --example frames
        timeout-minutes: 5

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Format
        run: cargo fmt --all --check
      - name: UI-language neutral
        if: ${{ !cancelled() }}
        run: scripts/check-ui-neutral.sh
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Docs
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build docs
        run: cargo doc --workspace --no-deps --exclude docs-check
      - name: Code in documents
        if: ${{ !cancelled() }}
        run: cargo test -p docs-check
      - name: Links in documents
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --root-dir ${{ github.workspace }} --no-progress '*.md' 'docs/**/*.md'
          fail: true

  deny:
    name: Deny
    needs: changes
    # Advisories appear without any change here, so main always checks; pull requests only when
    # their dependencies change.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.dependencies == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A prebuilt binary: seconds, instead of building cargo-deny's Docker image from Docker Hub.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check
        run: cargo deny check
