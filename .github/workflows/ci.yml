name: CI

# If the change filter itself fails, every job runs: a broken filter must cost minutes, never skip
# a check, since a skipped job satisfies a required one.
#
# The "Protect main" ruleset requires every job below by name. A skipped job still satisfies its
# required check, but only under its exact name, which is why the test jobs aren't a matrix: a
# skipped matrix job reports the unexpanded `Test (${{ matrix.os }})`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller target directories: faster to link and to cache.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    # The filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            dependencies:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  test-ubuntu:
    name: Test (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Test the facade's features
        run: cargo test -p artic --all-features
      - name: Test the registry's literals
        run: cargo test -p artic-registry --features literals

  test-windows:
    name: Test (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Smoke
        run: cargo run -p artic-winit --example smoke
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
      - name: Idle
        run: cargo run -p artic-winit --example frames
        timeout-minutes: 5

  test-macos:
    name: Test (macos-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Smoke
        run: cargo run -p artic-winit --example smoke
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
      - name: Idle
        run: cargo run -p artic-winit --example frames
        timeout-minutes: 5

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Format
        run: cargo fmt --all --check
      - name: UI-language neutral
        if: ${{ !cancelled() }}
        run: scripts/check-ui-neutral.sh
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Docs
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build docs
        run: cargo doc --workspace --no-deps --exclude docs-check
      - name: Code in documents
        if: ${{ !cancelled() }}
        run: cargo test -p docs-check
      - name: Links in documents
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --root-dir ${{ github.workspace }} --no-progress '*.md' 'docs/**/*.md'
          fail: true

  deny:
    name: Deny
    needs: changes
    # Advisories appear without any change here, so main always checks; pull requests only when
    # their dependencies change.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.dependencies == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A prebuilt binary: seconds, instead of building cargo-deny's Docker image from Docker Hub.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check
        run: cargo deny check
