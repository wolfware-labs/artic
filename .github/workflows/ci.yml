name: CI

# If the change filter itself fails, every job runs: a broken filter must cost minutes, never skip
# a check, since a skipped job satisfies a required one.
#
# The "Protect main" ruleset requires every job below by name. A skipped job still satisfies its
# required check, but only under its exact name, which is why the test jobs aren't a matrix: a
# skipped matrix job reports the unexpanded `Test (${{ matrix.os }})`.
#
# Mutation testing isn't a job here: petri mutates the lines a pull request changes on its own
# runners and reports `petri/mutants`, which the ruleset requires (CONTRIBUTING.md).
#
# CodSpeed's and Codecov's verdicts are check runs of their apps, which report nothing when the
# jobs that feed them are skipped, so the ruleset can't require them directly. It requires
# `CodSpeed` and `Coverage gate` instead: each waits for its app's check run on the pull request's
# head commit and passes or fails with it, and is skipped along with the job it follows. The gates'
# script is in both change filters, so a change to it runs them.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs that need more (the change filter, Codecov, CodSpeed and the gates) widen it for themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller target directories: faster to link and to cache.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    # The filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      benches: ${{ steps.filter.outputs.benches }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.cargo/**'
              # Every workflow, not only this one: Lint checks their checkouts.
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - 'scripts/**'
              - 'codecov.yml'
              - '.gitattributes'
            # What can move a bench, or how the benches run.
            benches:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
              - '.github/scripts/**'
            dependencies:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  test-ubuntu:
    name: Test (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-lavapipe
      - uses: ./.github/actions/setup-display
      - name: Build
        run: cargo build --locked --workspace --all-targets
      # Without a GPU the goldens skip and pass, and without a display the window test does;
      # lavapipe and Xvfb are there, so a missing adapter or display fails.
      - name: Test
        env:
          ARTIC_REQUIRE_GPU: "1"
          ARTIC_REQUIRE_DISPLAY: "1"
        run: cargo test --locked --workspace
        timeout-minutes: 30
      - name: Test the facade's features
        run: cargo test --locked -p artic --all-features
      - name: Test the registry without literals
        run: cargo test --locked -p artic-registry
      - name: Keep the golden diffs
        if: failure()
        uses: ./.github/actions/keep-goldens
      # A window opens under X11 (the Xvfb above) and under Wayland (weston below); smoke's log must
      # name the display server and frames' the adapter, rather than leaving them to winit's and
      # wgpu's choice.
      - name: Smoke on X11
        shell: bash
        run: |
          cargo run --locked -p artic-examples --example smoke | tee "$RUNNER_TEMP/smoke-x11.log"
          grep -q "display server: X11" "$RUNNER_TEMP/smoke-x11.log"
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
          WAYLAND_DISPLAY: ""
      - name: Idle on X11
        shell: bash
        run: |
          cargo run --locked -p artic-examples --example frames | tee "$RUNNER_TEMP/frames-x11.log"
          grep -q "llvmpipe" "$RUNNER_TEMP/frames-x11.log"
        timeout-minutes: 5
        env:
          WAYLAND_DISPLAY: ""
      - name: Hello on X11
        run: cargo run --locked -p artic-examples --example hello
        timeout-minutes: 5
        env:
          ARTIC_HELLO_SECONDS: "3"
          WAYLAND_DISPLAY: ""
      - id: wayland
        uses: ./.github/actions/setup-wayland
      - name: Smoke on Wayland
        shell: bash
        run: |
          cargo run --locked -p artic-examples --example smoke | tee "$RUNNER_TEMP/smoke-wayland.log"
          grep -q "display server: Wayland" "$RUNNER_TEMP/smoke-wayland.log"
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
          DISPLAY: ""
          WAYLAND_DISPLAY: ${{ steps.wayland.outputs.socket }}
      - name: Idle on Wayland
        shell: bash
        run: |
          cargo run --locked -p artic-examples --example frames | tee "$RUNNER_TEMP/frames-wayland.log"
          grep -q "llvmpipe" "$RUNNER_TEMP/frames-wayland.log"
        timeout-minutes: 5
        env:
          DISPLAY: ""
          WAYLAND_DISPLAY: ${{ steps.wayland.outputs.socket }}
      - name: Hello on Wayland
        run: cargo run --locked -p artic-examples --example hello
        timeout-minutes: 5
        env:
          ARTIC_HELLO_SECONDS: "3"
          DISPLAY: ""
          WAYLAND_DISPLAY: ${{ steps.wayland.outputs.socket }}

  coverage:
    name: Coverage
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-lavapipe
      - uses: ./.github/actions/setup-display
      - name: Install llvm-tools
        run: rustup component add llvm-tools
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov
      # The test jobs are the gate: a test that fails here, such as trybuild's comparison of
      # compiler output under instrumentation, still leaves a report. lavapipe lets the goldens run,
      # so the renderer's draw paths count as covered.
      - name: Measure
        run: cargo llvm-cov --locked --workspace --ignore-run-fail --lcov --output-path lcov.info
        timeout-minutes: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  # Uploading takes the job's OIDC token, so there's no Codecov token to store. It's a job of its
  # own so that the token is never reachable while the workspace's build scripts and tests run, and
  # every action it runs is pinned by commit. A pull request from a fork can't get a token; its
  # upload fails, and so does nothing else.
  codecov:
    name: Codecov
    needs: coverage
    if: ${{ !cancelled() && needs.coverage.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false

  # The criterion benches (artic-core, artic-layout, artic-controls, artic) under CodSpeed's CPU
  # simulation; CodSpeed compares a pull request against the latest commit of main that has a run.
  # The CodSpeed action authenticates with this job's OIDC token, so there's no CodSpeed token to
  # store. The action runs the benches itself, to measure them, and uploads in the same step, so
  # the token can't move to a job of its own as `codecov`'s does: the job holds it in every step,
  # and the benches' build scripts (in `cargo codspeed build`) and the benches can reach it. Every
  # action the job runs, `setup-rust`'s included, is pinned by commit.
  benchmarks:
    name: Benchmarks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.benches == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-codspeed@6.0.0
      - name: Build the benches
        run: cargo codspeed build --locked -m simulation
      - name: Run the benches
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run
  codspeed-gate:
    name: CodSpeed
    needs: [changes, benchmarks]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.benches == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for CodSpeed's verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          UPSTREAM_JOB: Benchmarks
          UPSTREAM_RESULT: ${{ needs.benchmarks.result }}
        run: .github/scripts/wait-for-verdict.sh "CodSpeed Performance Analysis" 257293

  coverage-gate:
    name: Coverage gate
    needs: [changes, codecov]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for Codecov's verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          UPSTREAM_JOB: Codecov
          UPSTREAM_RESULT: ${{ needs.codecov.result }}
        run: .github/scripts/wait-for-verdict.sh codecov/patch 254

  test-windows:
    name: Test (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    # The runners' only GPU adapter is WARP, on DX12, which vello refuses, so the goldens and the
    # examples render on lavapipe, the same CPU Vulkan driver as on Linux.
    env:
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-lavapipe
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
        timeout-minutes: 30
        env:
          ARTIC_REQUIRE_GPU: "1"
      - name: Keep the golden diffs
        if: failure()
        uses: ./.github/actions/keep-goldens
      - name: Smoke
        run: cargo run --locked -p artic-examples --example smoke
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
      - name: Idle
        run: cargo run --locked -p artic-examples --example frames
        timeout-minutes: 5
      - name: Hello
        run: cargo run --locked -p artic-examples --example hello
        timeout-minutes: 5
        env:
          ARTIC_HELLO_SECONDS: "3"

  test-macos:
    name: Test (macos-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --locked --workspace --all-targets
      # The runners have a Metal adapter, so the goldens run instead of skipping.
      - name: Test
        run: cargo test --locked --workspace
        timeout-minutes: 30
        env:
          ARTIC_REQUIRE_GPU: "1"
      - name: Keep the golden diffs
        if: failure()
        uses: ./.github/actions/keep-goldens
      - name: Smoke
        run: cargo run --locked -p artic-examples --example smoke
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
      - name: Idle
        run: cargo run --locked -p artic-examples --example frames
        timeout-minutes: 5
      - name: Hello
        run: cargo run --locked -p artic-examples --example hello
        timeout-minutes: 5
        env:
          ARTIC_HELLO_SECONDS: "3"

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Format
        run: cargo fmt --all --check
      - name: UI-language neutral
        if: ${{ !cancelled() }}
        run: scripts/check-ui-neutral.sh
      # The runner image ships yq (mikefarah), which the check reads the workflows with.
      - name: Checkout credentials
        if: ${{ !cancelled() }}
        run: |
          scripts/test-check-checkout-credentials.sh
          scripts/check-checkout-credentials.sh
      - name: Locked cargo and token permissions
        if: ${{ !cancelled() }}
        run: |
          scripts/test-check-cargo-locked.sh
          scripts/check-cargo-locked.sh
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # The crates app code uses must stay buildable for a later web host (D24). The ones that reach
  # `linkme` wait for #241; docs/design/web-portability.md lists both sets.
  wasm:
    name: Wasm
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Add the target
        run: rustup target add wasm32-unknown-unknown
      # One crate per check: Cargo unifies the features of the crates one command checks, so a
      # crate could pass only because another one turned a feature on.
      - name: Portable crates
        run: |
          failed=0
          for crate in artic-core artic-diagnostics artic-ident artic-i18n artic-layout artic-text artic-xaml; do
            cargo check --locked --target wasm32-unknown-unknown -p "$crate" || failed=1
          done
          exit "$failed"

  docs:
    name: Docs
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Build docs
        run: cargo doc --locked --workspace --no-deps --exclude docs-check
      - name: Code in documents
        if: ${{ !cancelled() }}
        run: cargo test --locked -p docs-check
      - name: Links in documents
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --root-dir ${{ github.workspace }} --no-progress '*.md' 'docs/**/*.md'
          fail: true

  deny:
    name: Deny
    needs: changes
    # Advisories appear without any change here, so main always checks; pull requests only when
    # their dependencies change.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.dependencies == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A prebuilt binary: seconds, instead of building cargo-deny's Docker image from Docker Hub.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: Check
        run: cargo deny --locked check
