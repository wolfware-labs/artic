name: CI

# If the change filter itself fails, every job runs: a broken filter must cost minutes, never skip
# a check, since a skipped job satisfies a required one.
#
# The "Protect main" ruleset requires every job below by name. A skipped job still satisfies its
# required check, but only under its exact name, which is why the test jobs aren't a matrix: a
# skipped matrix job reports the unexpanded `Test (${{ matrix.os }})`.
#
# The mutants shards are a matrix, so the ruleset requires `Mutants`, the job that reports
# whether every shard passed or was skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller target directories: faster to link and to cache.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    # The filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            dependencies:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  test-ubuntu:
    name: Test (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-lavapipe
      - name: Build
        run: cargo build --workspace --all-targets
      # Without a GPU the goldens skip and pass; lavapipe is there, so a missing adapter fails.
      - name: Test
        env:
          ARTIC_REQUIRE_GPU: "1"
        run: cargo test --workspace
      - name: Test the facade's features
        run: cargo test -p artic --all-features
      - name: Test the registry without literals
        run: cargo test -p artic-registry

  coverage:
    name: Coverage
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Install llvm-tools
        run: rustup component add llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The test jobs are the gate: a test that fails here, such as trybuild's comparison of
      # compiler output under instrumentation, still leaves a report. The GPU goldens skip on a
      # runner without a GPU, so the renderer's draw paths read as uncovered.
      - name: Measure
        run: cargo llvm-cov --workspace --ignore-run-fail --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  # Uploading takes the job's OIDC token, so there's no Codecov token to store. It's a job of its
  # own so that the token is never reachable while the workspace's build scripts and tests run, and
  # every action it runs is pinned by commit. A pull request from a fork can't get a token; its
  # upload fails, and so does nothing else.
  codecov:
    name: Codecov
    needs: coverage
    if: ${{ !cancelled() && needs.coverage.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false

  # Mutates the lines a pull request changes (.cargo/mutants.toml): each mutant must make a test
  # fail or stop the build, so one that survives, code no test checks, fails its shard.
  mutants:
    name: Mutants (shard ${{ matrix.shard }}/8)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Diff against the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: git diff "origin/$BASE...HEAD" > "$RUNNER_TEMP/pr.diff"
      # --in-place builds in the checkout, so the restored dependency cache is reused instead of
      # copying the tree for every mutant.
      - name: Mutate the changed lines
        run: >-
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --in-place --no-shuffle
          --shard ${{ matrix.shard }}/8 --output "$RUNNER_TEMP"
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out
          retention-days: 7

  mutants-ok:
    name: Mutants
    needs: mutants
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed or was skipped
        env:
          RESULT: ${{ needs.mutants.result }}
        run: |
          echo "mutants: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]

  test-windows:
    name: Test (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Smoke
        run: cargo run -p artic-examples --example smoke
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
      - name: Idle
        run: cargo run -p artic-examples --example frames
        timeout-minutes: 5

  test-macos:
    name: Test (macos-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Smoke
        run: cargo run -p artic-examples --example smoke
        timeout-minutes: 5
        env:
          ARTIC_SMOKE_FRAMES: "60"
      - name: Idle
        run: cargo run -p artic-examples --example frames
        timeout-minutes: 5

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Format
        run: cargo fmt --all --check
      - name: UI-language neutral
        if: ${{ !cancelled() }}
        run: scripts/check-ui-neutral.sh
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Docs
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build docs
        run: cargo doc --workspace --no-deps --exclude docs-check
      - name: Code in documents
        if: ${{ !cancelled() }}
        run: cargo test -p docs-check
      - name: Links in documents
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --root-dir ${{ github.workspace }} --no-progress '*.md' 'docs/**/*.md'
          fail: true

  deny:
    name: Deny
    needs: changes
    # Advisories appear without any change here, so main always checks; pull requests only when
    # their dependencies change.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.dependencies == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A prebuilt binary: seconds, instead of building cargo-deny's Docker image from Docker Hub.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check
        run: cargo deny check
