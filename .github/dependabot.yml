version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: ["type:infra", "crate:workspace"]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    # The composite actions under .github/actions pin actions of their own.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["type:infra", "crate:workspace"]
    groups:
      actions:
        patterns: ["*"]
