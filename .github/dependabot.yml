version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # No version younger than 14 days: a fresh release has had no time to be yanked or found compromised.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["type:infra", "crate:workspace"]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # No version younger than 14 days: a fresh release has had no time to be yanked or found compromised.
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    labels: ["type:infra", "crate:workspace"]
    groups:
      actions:
        patterns: ["*"]
