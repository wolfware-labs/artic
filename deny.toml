# Dependency policy, enforced in CI with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licenses compatible with distributing artic under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# The test font is under the SIL Open Font License; only the crate that holds it carries that licence.
exceptions = [{ crate = "artic-test-fonts", allow = ["OFL-1.1"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The backends stay in their adapters (docs/architecture.md): only artic-winit reaches winit, only
# artic-vello reaches vello, and wgpu arrives through vello.
deny = [
    { crate = "winit", wrappers = ["artic-winit"] },
    { crate = "vello", wrappers = ["artic-vello"] },
    { crate = "wgpu", wrappers = ["vello"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
