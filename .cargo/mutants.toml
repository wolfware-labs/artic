# cargo-mutants: CI mutates the lines a pull request changes, and every mutant must make a test
# fail or stop the build. A mutant that survives marks code no test checks.

# Much of artic is tested from the crates above the one that holds the code, such as layout
# through the controls, so each mutant runs the whole workspace's tests.
test_workspace = true

# The auto timeout comes from the baseline run, whose trybuild cases are already compiled. A mutant
# below the macros makes trybuild compile them again, which takes minutes, not seconds.
minimum_test_timeout = 300

exclude_globs = [
    # Test-only packages outside the layers: what they hold is the tests themselves.
    "crates/artic-examples/**",
    "crates/docs-check/**",
    "crates/*/fixtures/**",
    # winit's loop needs a display server, which tests don't have; the `smoke` and `frames`
    # examples run it in CI.
    "crates/artic-winit/src/host.rs",
]

exclude_re = [
    # Hand-written Debug output is for a person reading a panic; no behavior depends on its text.
    '<impl (std::)?(fmt::)?Debug for ',
    # It returns `T::default()`, the expression the mutant writes.
    '<impl SharedKey<T> for PropertyKey<T>>::initial_value',
    # The star is symmetric about its vertical axis, so mirroring its x draws the same pixels.
    'artic-test/src/scenes\.rs:\d+:21: replace \+ with - in star',
    # These `|`s join disjoint wgpu usage flags, where `^` sets the same bits.
    'artic-vello/src/renderer\.rs:\d+:\d+: replace \| with \^ in (Renderer::render_to_pixels|storage_texture)$',
    # These trait defaults already return what the mutant writes: zero, nothing or no layer.
    'artic-element/src/element\.rs:\d+:\d+: replace (Element::layers -> Layers with Default::default\(\)|ElementImpl::measure_override -> Size with Default::default\(\)|ElementImpl::(arrange_override|render|accessibility) with \(\)|ElementImpl::clip -> Option<Shape> with None)$',
]
