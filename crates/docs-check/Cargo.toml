[package]
name = "docs-check"
description = "Compiles the Rust code blocks in the repository's documents"
version.workspace = true
# Edition 2024 merges doctests into one binary; each block here stays its own program, so the UI types
# one block registers never meet another block's.
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.cargo-machete]
# The documents' code blocks, compiled as this crate's doctests, use these; its own code doesn't.
ignored = ["artic-controls", "artic-core", "artic-registry"]

[dependencies]
artic-controls.workspace = true
artic-core.workspace = true
artic-registry.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
