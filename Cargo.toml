[workspace]
resolver = "3"
exclude = ["spikes"]
members = [
    "crates/artic",
    "crates/artic-cli",
    "crates/artic-controls",
    "crates/artic-core",
    "crates/artic-element",
    "crates/artic-i18n",
    "crates/artic-layout",
    "crates/artic-lsp",
    "crates/artic-macros",
    "crates/artic-platform",
    "crates/artic-registry",
    "crates/artic-registry/fixtures/linking",
    "crates/artic-registry/fixtures/types-a",
    "crates/artic-registry/fixtures/types-b",
    "crates/artic-render",
    "crates/artic-style",
    "crates/artic-test",
    "crates/artic-test-fonts",
    "crates/artic-text",
    "crates/artic-theme",
    "crates/artic-vello",
    "crates/artic-winit",
    "crates/artic-xaml",
    "crates/artic-xaml-compiler",
    "crates/artic-xaml-compiler/fixtures/app",
    "crates/artic-xaml-compiler/fixtures/controls",
    "crates/artic-xaml-runtime",
    "crates/docs-check",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Wolfware LLC"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wolfware-labs/artic"

[workspace.dependencies]
artic = { path = "crates/artic", version = "0.1.0" }
artic-cli = { path = "crates/artic-cli", version = "0.1.0" }
artic-controls = { path = "crates/artic-controls", version = "0.1.0" }
artic-core = { path = "crates/artic-core", version = "0.1.0" }
artic-element = { path = "crates/artic-element", version = "0.1.0" }
artic-i18n = { path = "crates/artic-i18n", version = "0.1.0" }
artic-layout = { path = "crates/artic-layout", version = "0.1.0" }
artic-lsp = { path = "crates/artic-lsp", version = "0.1.0" }
artic-macros = { path = "crates/artic-macros", version = "0.1.0" }
artic-platform = { path = "crates/artic-platform", version = "0.1.0" }
artic-registry = { path = "crates/artic-registry", version = "0.1.0" }
artic-render = { path = "crates/artic-render", version = "0.1.0" }
artic-style = { path = "crates/artic-style", version = "0.1.0" }
artic-test = { path = "crates/artic-test", version = "0.1.0" }
artic-test-fonts = { path = "crates/artic-test-fonts", version = "0.1.0" }
artic-text = { path = "crates/artic-text", version = "0.1.0" }
artic-theme = { path = "crates/artic-theme", version = "0.1.0" }
artic-vello = { path = "crates/artic-vello", version = "0.1.0" }
artic-winit = { path = "crates/artic-winit", version = "0.1.0" }
artic-xaml = { path = "crates/artic-xaml", version = "0.1.0" }
artic-xaml-compiler = { path = "crates/artic-xaml-compiler", version = "0.1.0" }
artic-xaml-runtime = { path = "crates/artic-xaml-runtime", version = "0.1.0" }

accesskit = "0.25.1"
# fontique and parley are pre-1.0, as vello is: pinned exactly. fontique loads fontconfig when it
# runs (`fontconfig-dlopen`), so building on Linux needs no fontconfig headers.
fontique = { version = "=0.11.1", features = ["fontconfig-dlopen"] }
insta = "1.49.0"
linkme = "0.3.37"
parley = "=0.12.0"
png = "0.18.1"
pollster = "1.0.1"
pretty_assertions = "1.4.1"
prettyplease = "0.3.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
quote = "1.0.47"
raw-window-handle = "0.6.2"
static_assertions = "1.1.0"
syn = { version = "3.0.6", features = ["full"] }
thiserror = "2.0.21"
trybuild = "1.0.122"
# skrifa is the font reader vello 0.11 draws glyphs with: pinned to vello's version, so artic-vello
# checks a face with the same code that would otherwise panic on it.
skrifa = { version = "=0.48.0", default-features = false, features = ["std"] }
# vello is pre-1.0 (spec §13 risks): pinned exactly. Its wgpu is used through `vello::wgpu`.
vello = "=0.11.0"
winit = { version = "0.30.13", default-features = false }
xmlparser = "0.13.6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
